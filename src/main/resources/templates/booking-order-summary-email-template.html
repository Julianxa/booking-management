<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title id="email-title"
           th:text="${title}">
      HK Tramways
    </title>
    <!--[if mso]>
      <noscript>
        <xml>
          <o:OfficeDocumentSettings>
            <o:PixelsPerInch>96</o:PixelsPerInch>
          </o:OfficeDocumentSettings>
        </xml>
      </noscript>
    <![endif]-->
    <style>
      body,
      table,
      td,
      a {
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }
      table,
      td {
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
      }
      img {
        -ms-interpolation-mode: bicubic;
        border: 0;
        outline: none;
        text-decoration: none;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #f7f7f5;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f7f7f5;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <!-- Email Wrapper -->
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      border="0"
      width="100%"
      style="background-color: #f7f7f5"
    >
      <tr>
        <td align="center" style="padding: 24px 16px">
          <!-- Email Container -->
          <table
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            border="0"
            width="600"
            style="
              max-width: 600px;
              width: 100%;
              background-color: #ffffff;
              border-radius: 8px;
              overflow: hidden;
            "
          >
            <!-- ===== HEADER ===== -->
            <tr>
              <td
                style="
                  background-color: #2d6a4f;
                  padding: 24px 32px;
                  text-align: center;
                "
              >
                <img
                  th:src="|cid:logo|"
                  alt="香港電車 HK Tramways"
                  width="160"
                  style="display: block; margin: 0 auto; max-width: 160px"
                />
              </td>
            </tr>

            <!-- ===== BODY CONTENT ===== -->
            <tr>
              <td style="padding: 32px 32px 0 32px">
                <!-- Title -->
                <h1
                  style="
                    margin: 0 0 20px 0;
                    font-size: 24px;
                    font-weight: 700;
                    color: #1a1a1a;
                    line-height: 1.3;
                  "
                >
                  <span th:text="${subject}">
                  </span>
                </h1>

                <th:block th:replace="~{email-greeting :: localizedGreeting}"></th:block>

                <!-- Intro paragraph -->
                <p
                  style="
                    margin: 0 0 20px 0;
                    font-size: 14px;
                    color: #444444;
                    line-height: 1.7;
                  "
                >
                  <div th:utext="${mainBody}">
                  </div>
                </p>

                <th:block th:replace="~{email-booking-id :: localizedBookingId}"></th:block>

                <!-- Divider -->
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  width="100%"
                >
                  <tr>
                    <td
                      style="
                        border-top: 1px solid #e5e5e5;
                        padding-bottom: 24px;
                      "
                    ></td>
                  </tr>
                </table>
              </td>
            </tr>
            <!-- ===== IMPORTANT INFORMATION ===== -->
            <tr>
              <td style="padding: 0 32px 28px 32px">
                <h3
                  style="
                    margin: 0 0 10px 0;
                    font-size: 14px;
                    font-weight: 700;
                    color: #2d6a4f;
                    line-height: 1.4;
                  "
                >
                  Important information
                </h3>
                <p
                  style="
                    margin: 0 0 12px 0;
                    font-size: 13px;
                    color: #444444;
                    line-height: 1.7;
                  "
                >
                  <div th:utext="${importantInfoIntro}">
                  </div>
                </p>
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  width="100%"
                >
                  <div th:utext="${importantInfoBody}">
                  </div>
                </table>
              </td>
            </tr>

            <!-- ===== ORDER SUMMARY ===== -->
            <tr>
              <td style="padding: 0 32px 28px 32px">
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  width="100%"
                  style="
                    background-color: #f5f0e8;
                    border-radius: 8px;
                    overflow: hidden;
                  "
                >
                  <tr>
                    <td style="padding: 24px">
                      <h3
                        style="
                          margin: 0 0 16px 0;
                          font-size: 16px;
                          font-weight: 700;
                          color: #2d6a4f;
                        "
                      >
                        Order Summary
                      </h3>

                      <div th:each="bookingEvent : ${bookingEvents}" style="margin-bottom: 20px;">
                        <!-- Item Row -->
                        <table
                          role="presentation"
                          cellpadding="0"
                          cellspacing="0"
                          border="0"
                          width="100%"
                          style="margin-bottom: 16px"
                        >
                          <tr>
                            <td valign="top">
                              <!-- Event Name -->
                              <p style="margin: 0 0 4px 0; font-size: 13px; font-weight: 700; color: #1a1a1a; line-height: 1.5;">
                                <span th:text="${bookingEvent.event.name} ?: 'Event'"></span>
                              </p>

                              <!-- Event Date, Time + Ticket Summary -->
                              <p style="margin: 0; font-size: 12px; color: #666666; line-height: 1.7;">
                                <span th:text="${bookingEvent.event.eventDate}"></span>
                                <br />
                                <span th:text="${bookingEvent.event.eventTime}"></span><br />

                                <!-- Ticket Summary -->
                                <span th:each="ticket, ticketStat : ${bookingEvent.tickets}">
                                  <span th:text="${ticket.name} + ' x ' + ${ticket.quantity}"></span>
                                  <span th:if="${!ticketStat.last}">, </span>
                                </span>
                              </p>
                            </td>

                            <td valign="top" align="right"
                                style="white-space: nowrap; font-size: 13px; color: #1a1a1a; font-weight: 700; padding-left: 16px;">
                              HK$<span th:text="${#numbers.formatDecimal(bookingEvent.total ?: 0, 0, 0)}"></span>
                            </td>
                          </tr>
                        </table>

                        <!-- Divider (show only if not the last item) -->
                        <table th:if="${bookingEventStat.index < bookingEvents.size() - 1}"
                          role="presentation"
                          cellpadding="0"
                          cellspacing="0"
                          border="0"
                          width="100%"
                        >
                          <tr>
                            <td style="border-top: 1px solid #d8d0bf; padding-bottom: 16px;"></td>
                          </tr>
                        </table>
                      </div>

                      <!-- Divider -->
                      <table
                        role="presentation"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                        width="100%"
                      >
                        <tr>
                          <td
                            style="
                              border-top: 1px solid #d8d0bf;
                              padding-bottom: 16px;
                            "
                          ></td>
                        </tr>
                      </table>

                      <!-- Subtotal -->
                      <table
                        role="presentation"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                        width="100%"
                        style="margin-bottom: 6px"
                      >
                        <tr>
                          <td style="font-size: 13px; color: #444444">
                            Subtotal
                          </td>
                          <td
                            align="right"
                            style="font-size: 13px; color: #1a1a1a"
                          >
                            HK$<span th:text="${grandTotal}"/>
                          </td>
                        </tr>
                      </table>

                      <!-- Promo Code -->
                      <table
                        role="presentation"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                        width="100%"
                        style="margin-bottom: 16px"
                      >
                        <tr th:if="${giftCertificateDiscount != null and giftCertificateDiscount > 0}">
                          <td
                            style="
                              font-size: 13px;
                              color: #2d6a4f;
                              font-weight: 700;
                            "
                          >
                            <span th:text="${giftCertificatePromoCode}"/>
                            <span th:if="${redeemedTickets != null and !redeemedTickets.isEmpty()}">
                                (<span th:each="ticket, stat : ${redeemedTickets}">
                                    <span th:text="${ticket.name}"></span> x <span th:text="${ticket.quantity}"></span>
                                    <span th:if="${!stat.last}">, </span>
                                </span>)
                            </span>
                          </td>
                          <td
                            align="right"
                            style="
                              font-size: 13px;
                              color: #2d6a4f;
                              font-weight: 700;
                            "
                          >
                            - HK$<span th:text="${giftCertificateDiscount}"/>
                          </td>
                        </tr>
                      </table>

                      <!-- Divider -->
                      <table
                        role="presentation"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                        width="100%"
                      >
                        <tr>
                          <td
                            style="
                              border-top: 1px solid #d8d0bf;
                              padding-bottom: 16px;
                            "
                          ></td>
                        </tr>
                      </table>

                      <!-- Total -->
                      <table
                        role="presentation"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                        width="100%"
                      >
                        <tr>
                          <td
                            style="
                              font-size: 15px;
                              font-weight: 700;
                              color: #1a1a1a;
                            "
                          >
                            Total
                          </td>
                          <td
                            align="right"
                            style="
                              font-size: 20px;
                              font-weight: 700;
                              color: #1a1a1a;
                            "
                          >
                            HK$<span th:text="${finalAmount}"/>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- ===== CONTACT / SIGN-OFF ===== -->
            <tr>
              <td style="padding: 0 32px 32px 32px">
                <p
                        style="
                    margin: 0 0 16px 0;
                    font-size: 13px;
                    color: #444444;
                    line-height: 1.7;
                  "
                >
                <div th:utext="${contactBody}">
                </div>
                </p>
                <p
                        th:if="${lang == 'HK'}"
                        style="
                    margin: 0;
                    font-size: 13px;
                    color: #1a1a1a;
                    font-weight: 700;
                    line-height: 1.6;
                  "
                >
                  香港電車團隊
                </p>
                <p
                        th:if="${lang == 'CN'}"
                        style="
                    margin: 0;
                    font-size: 13px;
                    color: #1a1a1a;
                    font-weight: 700;
                    line-height: 1.6;
                  "
                >
                  香港电车团队
                </p>
                <p
                        th:if="${lang == 'EN'}"
                        style="
                    margin: 0;
                    font-size: 13px;
                    color: #1a1a1a;
                    font-weight: 700;
                    line-height: 1.6;
                  "
                >
                  The Hong Kong Tramways Team
                </p>
              </td>
            </tr>

            <th:block th:replace="~{email-app-banner :: localizedAppBanner}"></th:block>

            <th:block th:replace="~{email-social-media :: localizedSocialMedia}"></th:block>

            <th:block th:replace="~{email-footer :: localizedFooter}"></th:block>
          </table>
          <!-- /Email Container -->
        </td>
      </tr>
    </table>
    <!-- /Email Wrapper -->
  </body>
</html>
