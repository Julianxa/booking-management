<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title id="email-title"
           th:text="${title}">
        HK Tramways
    </title>
    <!--[if mso]>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <![endif]-->
    <style>
      body,
      table,
      td,
      a {
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }
      table,
      td {
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
      }
      img {
        -ms-interpolation-mode: bicubic;
        border: 0;
        outline: none;
        text-decoration: none;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #f7f7f5;
      }
      a {
        color: inherit;
      }
    </style>
</head>
<body
        style="
      margin: 0;
      padding: 0;
      background-color: #f7f7f5;
      font-family: Arial, Helvetica, sans-serif;
    "
>
<!-- Email Wrapper -->
<table
        role="presentation"
        cellpadding="0"
        cellspacing="0"
        border="0"
        width="100%"
        style="background-color: #f7f7f5"
>
    <tr>
        <td align="center" style="padding: 24px 16px">
            <!-- Email Container -->
            <table
                    role="presentation"
                    cellpadding="0"
                    cellspacing="0"
                    border="0"
                    width="600"
                    style="
              max-width: 600px;
              width: 100%;
              background-color: #ffffff;
              border-radius: 8px;
              overflow: hidden;
            "
            >
                <!-- ===== HEADER ===== -->
                <tr>
                    <td
                            style="
                  background-color: #2d6a4f;
                  padding: 24px 32px;
                  text-align: center;
                "
                    >
                        <img
                                th:src="|cid:logo|"
                                alt="香港電車 HK Tramways"
                                width="160"
                                style="display: block; margin: 0 auto; max-width: 160px"
                        />
                    </td>
                </tr>

                <!-- ===== BODY CONTENT ===== -->
                <tr>
                    <td style="padding: 32px 32px 0 32px">
                        <!-- Title -->
                        <h1
                                style="
                    margin: 0 0 20px 0;
                    font-size: 24px;
                    font-weight: 700;
                    color: #1a1a1a;
                    line-height: 1.3;
                  "
                        >
                            <span th:text="${subject}">
                            </span>
                        </h1>

                        <th:block th:replace="~{email-greeting :: localizedGreeting}"></th:block>

                        <!-- Intro paragraph -->
                        <p
                                style="
                    margin: 0 0 20px 0;
                    font-size: 14px;
                    color: #444444;
                    line-height: 1.7;
                  "
                        >
                            <div th:utext="${mainBody}">
                            </div>
                        </p>

                        <th:block th:replace="~{email-booking-id :: localizedBookingId}"></th:block>

                        <!-- Divider -->
                        <table
                                role="presentation"
                                cellpadding="0"
                                cellspacing="0"
                                border="0"
                                width="100%"
                        >
                            <tr>
                                <td
                                        style="
                        border-top: 1px solid #e5e5e5;
                        padding-bottom: 24px;
                      "
                                ></td>
                            </tr>
                        </table>

                        <!-- ===== TOUR BOOKING BLOCK ===== -->
                        <table
                                role="presentation"
                                cellpadding="0"
                                cellspacing="0"
                                border="0"
                                width="100%"
                                style="margin-bottom: 24px"
                        >
                            <tr>
                                <td valign="top" style="padding-right: 16px">
                                    <h2
                                            style="
                          margin: 0 0 10px 0;
                          font-size: 16px;
                          font-weight: 700;
                          color: #2d6a4f;
                          line-height: 1.4;
                        "
                                    >
                                        <span th:text="${eventName}"/>
                                    </h2>
                                    <p
                                            style="
                          margin: 0;
                          font-size: 13px;
                          color: #444444;
                          line-height: 1.8;
                        "
                                    >
                                        <span th:text="${eventDate}"/><br />
                                        <span th:text="${eventTime}"/><br />
                                        <span th:text="${ticketSummary}"/>
                                    </p>
                                    <p
                                            style="
                                              margin: 0;
                                              font-size: 11px;
                                              color: #444444;
                                              line-height: 1.8;
                                            "
                                    >
                                        <a
                                                th:href="${activityDetailsUrl}"
                                                style="color: #888888; text-decoration: underline"
                                         th:text="${lang == 'CN' ? '活动详情' : (lang == 'HK' ? '活動詳情' : 'Activity Details')}"
                                >Activity Details</a>
                                    </p>
                                </td>
                            </tr>
                        </table>

                        <!-- Divider -->
                        <table
                                role="presentation"
                                cellpadding="0"
                                cellspacing="0"
                                border="0"
                                width="100%"
                        >
                            <tr>
                                <td
                                        style="border-top: 1px solid #e5e5e5;padding-bottom: 24px;"
                                ></td>
                            </tr>
                        </table>

                        <div th:each="attendee : ${attendees}">
                            <h3
                                    th:if="${lang == 'HK'}"
                                    style="margin: 0 0 12px 0;font-size: 14px;font-weight: 700;color: #2d6a4f;line-height: 1.4;"
                            >
                                <span th:if="${attendee.sequence == 1}" th:text="'主要賓客（聯絡人）'"></span>
                                <span th:if="${attendee.sequence != 1}"
                                      th:text="'賓客 ' + ${attendee.sequence}"></span>
                            </h3>
                            <h3
                                    th:if="${lang == 'CN'}"
                                    style="margin: 0 0 12px 0;font-size: 14px;font-weight: 700;color: #2d6a4f;line-height: 1.4;"
                            >
                                <span th:if="${attendee.sequence == 1}" th:text="'主要宾客（联系人）'"></span>
                                <span th:if="${attendee.sequence != 1}"
                                      th:text="'宾客 ' + ${attendee.sequence}"></span>
                            </h3>
                            <h3
                                    th:if="${lang == 'EN'}"
                                    style="margin: 0 0 12px 0;font-size: 14px;font-weight: 700;color: #2d6a4f;line-height: 1.4;"
                            >
                                <span th:if="${attendee.sequence == 1}" th:text="'Lead Guest (Contact Person)'"></span>
                                <span th:if="${attendee.sequence != 1}"
                                      th:text="'Guest ' + ${attendee.sequence}"></span>
                            </h3>
                            <table
                                    role="presentation"
                                    cellpadding="0"
                                    cellspacing="0"
                                    border="0"
                                    width="100%"
                                    style="margin-bottom: 8px"
                            >
                                <th:block th:if="${lang == 'HK'}">
                                    <tr>
                                        <td
                                                style="font-size: 13px;color: #444444;line-height: 2;padding-bottom: 2px;"
                                        >
                                            <strong style="color: #1a1a1a">名字：</strong> <span th:text="${attendee.firstName}"/>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td
                                                style="font-size: 13px;color: #444444;line-height: 2;padding-bottom: 2px;"
                                        >
                                            <strong style="color: #1a1a1a">姓氏：</strong> <span th:text="${attendee.lastName}"/>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td
                                                style="font-size: 13px;color: #444444;line-height: 2;padding-bottom: 2px;"
                                        >
                                            <strong style="color: #1a1a1a">電郵地址：</strong>
                                            <span th:text="${attendee.email}"/>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td
                                                style="font-size: 13px;color: #444444;line-height: 2;padding-bottom: 2px;"
                                        >
                                            <strong style="color: #1a1a1a">電話：</strong>
                                            <span th:text="${attendee.phone}"/>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td
                                                style="font-size: 13px;color: #444444;line-height: 2;padding-bottom: 2px;"
                                        >
                                            <strong style="color: #1a1a1a">國家/城市：</strong> <span th:text="${attendee.country}"/>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td style="font-size: 13px; color: #444444; line-height: 2">
                                            <strong style="color: #1a1a1a">性別：</strong>
                                            <span th:text="${
                                                #strings.equals(attendee.gender, 'M') ? '男' :
                                                #strings.equals(attendee.gender, 'F') ? '女' :
                                                #strings.equals(attendee.gender, 'N') ? '不願透露' :
                                                '-'
                                            }"></span>
                                        </td>
                                    </tr>
                                </th:block>
                                <th:block th:if="${lang == 'CN'}">
                                    <tr>
                                        <td
                                                style="font-size: 13px;color: #444444;line-height: 2;padding-bottom: 2px;"
                                        >
                                            <strong style="color: #1a1a1a">名字：</strong> <span th:text="${attendee.firstName}"/>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td
                                                style="font-size: 13px;color: #444444;line-height: 2;padding-bottom: 2px;"
                                        >
                                            <strong style="color: #1a1a1a">姓氏：</strong> <span th:text="${attendee.lastName}"/>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td
                                                style="font-size: 13px;color: #444444;line-height: 2;padding-bottom: 2px;"
                                        >
                                            <strong style="color: #1a1a1a">电邮地址：</strong>
                                            <span th:text="${attendee.email}"/>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td
                                                style="font-size: 13px;color: #444444;line-height: 2;padding-bottom: 2px;"
                                        >
                                            <strong style="color: #1a1a1a">电话：</strong>
                                            <span th:text="${attendee.phone}"/>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td
                                                style="font-size: 13px;color: #444444;line-height: 2;padding-bottom: 2px;"
                                        >
                                            <strong style="color: #1a1a1a">国家/城市：</strong> <span th:text="${attendee.country}"/>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td style="font-size: 13px; color: #444444; line-height: 2">
                                            <strong style="color: #1a1a1a">性别：</strong>
                                            <span th:text="${
                                                #strings.equals(attendee.gender, 'M') ? '男' :
                                                #strings.equals(attendee.gender, 'F') ? '女' :
                                                #strings.equals(attendee.gender, 'N') ? '不愿透露' :
                                                '-'
                                            }"></span>
                                        </td>
                                    </tr>
                                </th:block>
                                <th:block th:if="${lang == 'EN'}">
                                    <tr>
                                        <td
                                                style="font-size: 13px;color: #444444;line-height: 2;padding-bottom: 2px;"
                                        >
                                            <strong style="color: #1a1a1a">First Name:</strong> <span th:text="${attendee.firstName}"/>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td
                                                style="font-size: 13px;color: #444444;line-height: 2;padding-bottom: 2px;"
                                        >
                                            <strong style="color: #1a1a1a">Last Name:</strong> <span th:text="${attendee.lastName}"/>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td
                                                style="font-size: 13px;color: #444444;line-height: 2;padding-bottom: 2px;"
                                        >
                                            <strong style="color: #1a1a1a">Email Address:</strong>
                                            <span th:text="${attendee.email}"/>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td
                                                style="font-size: 13px;color: #444444;line-height: 2;padding-bottom: 2px;"
                                        >
                                            <strong style="color: #1a1a1a">Telephone:</strong>
                                            <span th:text="${attendee.phone}"/>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td
                                                style="font-size: 13px;color: #444444;line-height: 2;padding-bottom: 2px;"
                                        >
                                            <strong style="color: #1a1a1a">Country/City:</strong> <span th:text="${attendee.country}"/>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td style="font-size: 13px; color: #444444; line-height: 2">
                                            <strong style="color: #1a1a1a">Gender:</strong>
                                            <span th:text="${
                                                #strings.equals(attendee.gender, 'M') ? 'Male' :
                                                #strings.equals(attendee.gender, 'F') ? 'Female' :
                                                #strings.equals(attendee.gender, 'N') ? 'Prefer not to say' :
                                                '-'
                                            }"></span>
                                        </td>
                                    </tr>
                                </th:block>
                            </table>
                        </div>

                        <!-- Divider -->
                        <table
                                role="presentation"
                                cellpadding="0"
                                cellspacing="0"
                                border="0"
                                width="100%"
                        >
                            <tr>
                                <td
                                        style="border-top: 1px solid #e5e5e5; padding-top: 24px"
                                ></td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- ===== IMPORTANT INFORMATION ===== -->
                <tr>
                    <td style="padding: 0 32px 28px 32px">
                        <h3
                                th:if="${lang == 'HK'}"
                                style="
                    margin: 0 0 10px 0;
                    font-size: 14px;
                    font-weight: 700;
                    color: #2d6a4f;
                    line-height: 1.4;
                  "
                        >
                            重要資訊
                        </h3>
                        <h3
                                th:if="${lang == 'CN'}"
                                style="
                    margin: 0 0 10px 0;
                    font-size: 14px;
                    font-weight: 700;
                    color: #2d6a4f;
                    line-height: 1.4;
                  "
                        >
                            重要信息
                        </h3>
                        <h3
                                th:if="${lang == 'EN'}"
                                style="
                    margin: 0 0 10px 0;
                    font-size: 14px;
                    font-weight: 700;
                    color: #2d6a4f;
                    line-height: 1.4;
                  "
                        >
                            Important information
                        </h3>
                        <p
                                style="margin: 0 0 12px 0;font-size: 13px;color: #444444;line-height: 1.7;"
                        >
                        <div th:utext="${importantInfoIntro}">
                        </div>
                        </p>
                        <table
                                role="presentation"
                                cellpadding="0"
                                cellspacing="0"
                                border="0"
                                width="100%"
                        >
                            <div th:utext="${importantInfoBody}">
                            </div>
                        </table>
                    </td>
                </tr>

                <!-- ===== CONTACT / SIGN-OFF ===== -->
                <tr>
                    <td style="padding: 0 32px 32px 32px">
                        <p
                                style="
                    margin: 0 0 16px 0;
                    font-size: 13px;
                    color: #444444;
                    line-height: 1.7;
                  "
                        >
                            <div th:utext="${contactBody}">
                            </div>
                        </p>
                        <p
                                th:if="${lang == 'HK'}"
                                style="
                    margin: 0;
                    font-size: 13px;
                    color: #1a1a1a;
                    font-weight: 700;
                    line-height: 1.6;
                  "
                        >
                            香港電車團隊
                        </p>
                        <p
                                th:if="${lang == 'CN'}"
                                style="
                    margin: 0;
                    font-size: 13px;
                    color: #1a1a1a;
                    font-weight: 700;
                    line-height: 1.6;
                  "
                        >
                            香港电车团队
                        </p>
                        <p
                                th:if="${lang == 'EN'}"
                                style="
                    margin: 0;
                    font-size: 13px;
                    color: #1a1a1a;
                    font-weight: 700;
                    line-height: 1.6;
                  "
                        >
                            The Hong Kong Tramways Team
                        </p>
                    </td>
                </tr>

                <th:block th:replace="~{email-app-banner :: localizedAppBanner}"></th:block>

                <th:block th:replace="~{email-social-media :: localizedSocialMedia}"></th:block>

                <th:block th:replace="~{email-footer :: localizedFooter}"></th:block>
            </table>
            <!-- /Email Container -->
        </td>
    </tr>
</table>
<!-- /Email Wrapper -->
</body>
</html>
